apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/YOUR-USER/argo-lab.git
    targetRevision: HEAD
    path: applications/demo

  destination:
    server: https://kubernetes.default.svc
    namespace: demo